# Профиль сервиса для черновиков Claude (DRAFT_PROVIDER=llm).
# Скопируйте в profile.local.yaml (он в .gitignore) и впишите настоящие отзывы.
# Здесь отзывы — заглушки: настоящие отзывы клиентов в репозиторий не попадают.
#
# Черновик может утверждать о сервисе только то, что есть в facts, и цитировать
# отзывы только дословно (целиком или непрерывным фрагментом), не больше одного.
# Проверка (guard) требует в черновике одну из disclosure_phrases и название сервиса.

name: Chit Trip
aliases: [Чит Трип]
countries: [Индонезия, Таиланд, ОАЭ, Черногория, Испания]
services: [жильё, экскурсии, авиабилеты]
facts:
  - Жильё напрямую от собственников
  - Без предоплаты
  - Помогаем найти выгодно
# Фразы, которые раскрывают связь с сервисом. Оставляйте только те, что прямо
# говорят о сотрудничестве: «советую сервис» само по себе связь не раскрывает.
disclosure_phrases: [сотрудничаю, работаю с, представляю]
reviews:
  - id: example_flights
    text: "ЗАГЛУШКА: отзыв клиента о билетах, дословно, как его прислал клиент."
  - id: example_rent
    text: "ЗАГЛУШКА: отзыв клиента о долгосрочной аренде жилья, дословно."
