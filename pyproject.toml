[project]
name = "telegram-dispatcher"
version = "0.1.0"
description = "Ядро диспетчера входящих заявок Telegram: приём, назначение операторам, outbox"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy[asyncio]>=2.1,<2.2",
    "asyncpg>=0.32",
    "alembic>=1.20",
    "pydantic-settings>=2.15",
    "structlog>=26.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra"
